<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Portfolio Assistant - Ibrahim Danno</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --light-bg: #f4f7f6;
            --white: #ffffff;
            --bot-msg: #e8f1f8;
            --user-msg: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-wrapper {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            background: var(--white);
            display: flex;
            flex-direction: column;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: var(--primary-color);
            color: var(--white);
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 1.2rem;
        }

        .chat-header p {
            margin: 5px 0 0;
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Messages Area */
        #chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 80%;
            line-height: 1.4;
            font-size: 0.95rem;
        }

        .bot {
            background: var(--bot-msg);
            color: var(--primary-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user {
            background: var(--user-msg);
            color: var(--white);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        /* Input Area */
        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        button {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: var(--primary-color);
        }

        /* Back to Portfolio Link */
        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-link">← Zurück zum Portfolio</a>

    <div class="chat-wrapper">
        <div class="chat-header">
            <h2>M.Ibrahim Danno <br> KI Assistant</h2>
            <p>Fragen Sie mich nach Ibrahims Qualifikationen (RAG Alpha V1.0)</p>
        </div>

        <div id="chat-box">
            <div class="message bot">
                Hallo! Ich bin der KI-Assistent von Ibrahim Danno.
                Ich habe sein Portfolio und seine Bewerbungsunterlagen analysiert. Wie kann ich Ihnen heute helfen?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-query" placeholder="Schreiben Sie Ihre Frage...">
            <button onclick="sendMessage()">Senden</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('user-query');
            const chatBox = document.getElementById('chat-box');

            if (input.value.trim() !== "") {
                // User Message
                const userDiv = document.createElement('div');
                userDiv.className = 'message user';
                userDiv.textContent = input.value;
                chatBox.appendChild(userDiv);

                // Placeholder for Bot Response (Next Phase)
                setTimeout(() => {
                    const botDiv = document.createElement('div');
                    botDiv.className = 'message bot';
                    botDiv.textContent = "Vielen Dank für Ihre Frage. In der nächsten Phase werde ich direkt aus Ibrahims PDF antworten!";
                    chatBox.appendChild(botDiv);
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 1000);

                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>

</html>
